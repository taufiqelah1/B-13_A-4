<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
  
</head>
<body>
     <main>
        <h1>Job Application Tracker</h1>
        <div class="dashboard">
            <div class="dashboard-card">
                <p>Total</p>
                <h2 id="total-count">8</h2>
            </div>

            <div class="dashboard-card">
                <p>Interview</p>
                <h2 id="interview-count">0</h2>
            </div>

            <div class="dashboard-card">
                <p>Rejected</p>
                <h2 id="rejected-count">0</h2>
            </div>
        </div>

 <hr>

  <div class="section-heading">
            <h2>Available Jobs</h2>
            <p><span id="jobs-count">8</span> jobs</p>
        </div>

        <!-- Filter buttons -->
        <div class="tabs">
            <button id="all-tab" class="active"
                onclick="showTab('All')">
                All
            </button>

            <button id="interview-tab"
                onclick="showTab('Interview')">
                Interview
            </button>

            <button id="rejected-tab"
                onclick="showTab('Rejected')">
                Rejected
            </button>
        </div>





     </main>
</body>
</html>
